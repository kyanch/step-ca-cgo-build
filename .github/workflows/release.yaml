
name: Release step-ca CGO

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Official step-ca release tag"
        required: true
        type: string
        default: "v0.30.2"

permissions:
  contents: read

concurrency:
  group: step-ca-cgo-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            goarch: amd64

          - arch: arm64
            runner: ubuntu-24.04-arm
            goarch: arm64

    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Validate source tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid source tag: $SOURCE_TAG"
            exit 1
          fi

      - name: Checkout official step-ca
        uses: actions/checkout@v6
        with:
          repository: smallstep/certificates
          ref: ${{ inputs.source_tag }}
          path: certificates
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: certificates/go.mod
          cache: true
          cache-dependency-path: certificates/go.sum

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libpcsclite-dev \
            libusb-1.0-0-dev

      - name: Verify build environment
        run: |
          set -euo pipefail

          uname -m
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          pkg-config --modversion libpcsclite

      - name: Build with official Makefile
        working-directory: certificates
        env:
          VERSION: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail

          env -u GITHUB_REF \
            make build \
              GO_ENVS="CGO_ENABLED=1" \
              VERSION="$VERSION"

      - name: Verify binary
        working-directory: certificates
        run: |
          set -euo pipefail

          ./bin/step-ca version
          file ./bin/step-ca

          go version -m ./bin/step-ca

          go version -m ./bin/step-ca \
            | grep -F "GOARCH=$GOARCH"

          go version -m ./bin/step-ca \
            | grep -F 'CGO_ENABLED=1'

      - name: Package binary
        working-directory: certificates
        run: |
          set -euo pipefail

          VERSION="${SOURCE_TAG#v}"
          ARCHIVE="step-ca_${VERSION}_linux_${GOARCH}_cgo.tar.gz"

          mkdir -p dist

          tar -czf "dist/$ARCHIVE" \
            -C bin step-ca

          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: step-ca-linux-${{ matrix.arch }}-cgo
          path: certificates/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: step-ca-linux-*-cgo
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum *.tar.gz > checksums.txt

          cat checksums.txt
          ls -lh

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${SOURCE_TAG#v}"
          RELEASE_TAG="cgo-${SOURCE_TAG}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "step-ca ${VERSION} (CGO)" \
            --notes "CGO-enabled builds of step-ca.

          Upstream source: https://github.com/smallstep/certificates/tree/${SOURCE_TAG}

          Platforms:
          - Linux amd64
          - Linux arm64

          Build:
          - Official Makefile
          - CGO_ENABLED=1
          - Native architecture compilation

          These are independently built binaries, not official Smallstep release artifacts." \
            --latest=false
