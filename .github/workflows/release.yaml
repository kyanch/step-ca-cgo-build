
name: Release step-ca CGO

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Official step-ca release tag"
        required: true
        type: string
        default: "v0.30.2"

permissions:
  contents: write

concurrency:
  group: step-ca-release-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release Linux amd64
    runs-on: ubuntu-24.04

    env:
      SOURCE_TAG: ${{ inputs.source_tag }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid step-ca release tag"
            exit 1
          fi

          VERSION="${SOURCE_TAG#v}"
          RELEASE_TAG="cgo-${SOURCE_TAG}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout official step-ca
        uses: actions/checkout@v4
        with:
          repository: smallstep/certificates
          ref: ${{ inputs.source_tag }}
          path: certificates
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: certificates/go.mod
          cache: true
          cache-dependency-path: certificates/go.sum

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libpcsclite-dev \
            libusb-1.0-0-dev

      - name: Build using official Makefile
        working-directory: certificates
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          env -u GITHUB_REF \
            make build \
              GO_ENVS="CGO_ENABLED=1" \
              VERSION="$VERSION"

      - name: Verify CGO binary
        working-directory: certificates
        run: |
          set -euo pipefail

          ./bin/step-ca version
          file ./bin/step-ca
          ldd ./bin/step-ca || true

          go version -m ./bin/step-ca

          go version -m ./bin/step-ca \
            | grep 'CGO_ENABLED=1'

      - name: Package Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          ARCHIVE="step-ca_${VERSION}_linux_amd64_cgo.tar.gz"

          tar -czf "dist/$ARCHIVE" \
            -C certificates/bin step-ca

          (
            cd dist
            sha256sum "$ARCHIVE" > checksums.txt
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: step-ca-cgo-linux-amd64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "step-ca ${VERSION} (CGO)" \
            --notes "CGO-enabled build of smallstep/certificates ${SOURCE_TAG}.

          Source: https://github.com/smallstep/certificates/tree/${SOURCE_TAG}

          Platform: Linux amd64
          CGO_ENABLED: 1
          Build: official Makefile" \
            --latest=false
